<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing</title>
  <link rel="stylesheet" href="src/card.css">
  <link rel="stylesheet" href="src/header.css">
  <link rel="stylesheet" href="src/button.css">
  <link rel="stylesheet" href="src/toolbar.css">
</head>
<body>
  <header class="site-header">Acme Billing</header>
  <main class="card">
    <h1>Invoices</h1>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Search invoices" aria-label="Search invoices">
      <select class="filter" aria-label="Status"><option>All</option><option>Paid</option><option>Due</option></select>
      <div class="actions"><button class="btn" id="download">Download invoice</button></div>
    </div>
    <p>Invoice #1042 · $240.00 · Paid</p>
    <form class="settings">
      <label>Billing email <input type="email" value="ops@acme.test"></label>
      <button class="btn" id="save" type="button">Save</button>
    </form>
  </main>
</body>
</html>
