name: Adoption snapshot

# Daily stars, skills.sh installs and GitHub traffic, committed to the `metrics` branch so main stays clean.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the metrics branch
        run: |
          git fetch origin metrics || true
          if git rev-parse --verify -q origin/metrics; then
            git worktree add metrics-branch origin/metrics
            git -C metrics-branch checkout -B metrics
          else
            git worktree add --orphan -b metrics metrics-branch
          fi
      - name: Record snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/adoption.py --out metrics-branch
      - name: Commit
        working-directory: metrics-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Adoption snapshot $(date -u +%F)"
          git push origin metrics
